# ====================================================================
# Student Course Management System - Application Configuration
# ====================================================================
# This file contains all configuration properties for the Spring Boot
# application. These properties are read automatically by Spring Boot
# and used to configure various components.
# ====================================================================

# Application Name and Description
spring.application.name=student-course-management

# ====================================================================
# SERVER CONFIGURATION
# ====================================================================
# Port on which the application will run
server.port=8080

# Context path for all REST endpoints
# All API endpoints will be prefixed with this path
server.servlet.context-path=/


# ====================================================================
# DATABASE CONFIGURATION (MySQL)
# ====================================================================
# NOTE: Before running the application, you MUST:
# 1. Install and start MySQL Server
# 2. Create the database using: CREATE DATABASE student_course_db;
# 3. Update the credentials below if your MySQL setup is different

# MySQL Database Connection URL
# Format: jdbc:mysql://[host]:[port]/[database_name]?[options]
# - createDatabaseIfNotExist=true: Automatically creates the database if it doesn't exist
# TO CREATE MANUALLY: CREATE DATABASE student_course_db;
spring.datasource.url=jdbc:mysql://localhost:3306/student_course_db?createDatabaseIfNotExist=true

# MySQL Username (default: root)
# Change if your MySQL user is different
spring.datasource.username=root

# MySQL Password (default: no password)
# Change if your MySQL user has a password
spring.datasource.password=root

# MySQL JDBC Driver Class
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ====================================================================
# JPA / HIBERNATE CONFIGURATION
# ====================================================================
# JPA/Hibernate automatically creates and updates database tables
# based on your entity classes

# DDL (Data Definition Language) Auto Strategy
# - update: Updates existing schema; useful for development
# - create: Drops all tables and recreates them (use with caution!)
# - create-drop: Creates tables on startup, drops on shutdown
# - validate: Only validates schema exists; doesn't make changes
# - none: Does not perform any DDL operations
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries executed by Hibernate
# Useful for debugging and understanding generated SQL
spring.jpa.show-sql=true

# Hibernate Dialect for MySQL 8
# Tells Hibernate which SQL dialect to use for database operations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Format SQL queries to be more readable in logs
# Makes printed SQL easier to read with proper indentation
spring.jpa.properties.hibernate.format_sql=true

# Add comments to generated SQL statements
# Adds useful comments in SQL that explain which entity/field is being accessed
spring.jpa.properties.hibernate.use_sql_comments=true


# ====================================================================
# LOGGING CONFIGURATION
# ====================================================================
# Set logging levels for different components

# Root logger level (can be TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=INFO

# Log level for Spring Framework
logging.level.org.springframework=INFO

# Log level for Hibernate (useful for debugging database operations)
logging.level.org.hibernate=INFO

# Log level for your application package
logging.level.com.example.studentcourse=DEBUG


# ====================================================================
# CONNECTION POOL CONFIGURATION
# ====================================================================
# Hikari is the default connection pool for Spring Boot

# Maximum number of connections to keep in the pool
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections to keep in the pool
spring.datasource.hikari.minimum-idle=2

# Maximum time (in milliseconds) to wait for a connection from pool
spring.datasource.hikari.connection-timeout=20000

# Maximum time (in milliseconds) a connection can be idle before being closed
spring.datasource.hikari.idle-timeout=300000

# Maximum time (in milliseconds) a connection can be active
spring.datasource.hikari.max-lifetime=1200000


# ====================================================================
# REFERENCES AND DOCUMENTATION
# ====================================================================
# Database Schema (created automatically by Hibernate):
#
# students table:
#   - id (BIGINT PRIMARY KEY, AUTO_INCREMENT)
#   - name (VARCHAR(255) NOT NULL)
#   - email (VARCHAR(255) UNIQUE NOT NULL)
#   - roll_number (VARCHAR(255) UNIQUE NOT NULL)
#   - phone_number (VARCHAR(20))
#   - created_at (TIMESTAMP NOT NULL)
#   - updated_at (TIMESTAMP NOT NULL)
#
# courses table:
#   - id (BIGINT PRIMARY KEY, AUTO_INCREMENT)
#   - course_code (VARCHAR(255) UNIQUE NOT NULL)
#   - course_name (VARCHAR(255) NOT NULL)
#   - description (TEXT)
#   - credits (INT NOT NULL)
#   - instructor_name (VARCHAR(255) NOT NULL)
#   - max_students (INT)
#   - created_at (TIMESTAMP NOT NULL)
#   - updated_at (TIMESTAMP NOT NULL)
#
# student_course table (JOIN TABLE for Many-to-Many):
#   - student_id (BIGINT FOREIGN KEY references students.id)
#   - course_id (BIGINT FOREIGN KEY references courses.id)
#   - PRIMARY KEY (student_id, course_id)
#
# ====================================================================
